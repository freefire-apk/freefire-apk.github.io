name: Rename free-fire.html to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename free-fire.html to index.html
        run: |
          git config user.name "telenorsquiztodays"
          git config user.email "saaw2103@gmail.com"
          git mv free-fire.html index.html
          git commit -m "Rename free-fire.html to index.html"
          git push
