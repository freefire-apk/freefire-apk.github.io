name: Add GSC verification tag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert verification meta tag
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("index.html")
          text = p.read_text(encoding="utf-8")
          tag = '<meta name="google-site-verification" content="HoWofmErOOKMSn8dHeXvBTb5cGoEBEB1rQ7Y3CrUYgY" />'
          if "google-site-verification" in text:
              print("Tag already present")
          else:
              anchor = '<meta name="robots" content="index, follow" />'
              assert anchor in text, "anchor not found"
              text = text.replace(anchor, anchor + "\n" + tag, 1)
              p.write_text(text, encoding="utf-8")
              print("Tag inserted")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Google Search Console verification meta tag"
          git push
